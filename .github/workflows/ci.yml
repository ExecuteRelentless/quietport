name: ci
# Format, vet and test on every push and pull request. The Windows build lives in windows.yml (tags only).
on:
  push:
    branches: ["main"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.27" }
      - name: gofmt
        run: |
          bad=$(gofmt -l cmd internal scripts)
          if [ -n "$bad" ]; then echo "unformatted:"; echo "$bad"; exit 1; fi
      - name: vet
        run: go vet ./...
      - name: rclone for the two-device sync test (docs/adr/0022)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/rclone.zip" https://github.com/rclone/rclone/releases/download/v1.75.1/rclone-v1.75.1-linux-amd64.zip
          echo "982b5aa772841168f8e380f139e9e787b2a105403e32b94da8676a0e1c0a13ab  $RUNNER_TEMP/rclone.zip" | sha256sum -c -
          unzip -q -j "$RUNNER_TEMP/rclone.zip" '*/rclone' -d "$RUNNER_TEMP"
          echo "QP_RCLONE=$RUNNER_TEMP/rclone" >> "$GITHUB_ENV"
      - name: test
        run: go test ./... -count=1

  windows:
    # The Windows agent is a GUI-subsystem program so that the Scheduled Task can no longer open a console window for
    # it (docs/adr/0017). What a runner can prove is proved here: that the release build really produces a GUI
    # program, that a caller which redirects the output still gets it, and that a real Task Scheduler accepts the
    # repeating task. Two things need a session with a real console and are checked by hand in one before a release:
    # the absent window, and a GUI program printing into the terminal someone typed into, which cannot be watched
    # here because a runner has no interactive session. Skipping that hand check is how 0.1.22 shipped a fix that
    # did nothing.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.27" }
      - name: Build the agent the way a release builds it
        shell: pwsh
        run: |
          go build -trimpath -ldflags "-X main.Version=citest -H windowsgui" -o qpsync-agent.exe ./cmd/qpsync-agent
      - name: The PE header says GUI, so Windows allocates no console
        shell: pwsh
        run: |
          python scripts/assert-windows-gui.py qpsync-agent.exe
          if ($LASTEXITCODE -ne 0) { throw "the release build would still be given a console window" }
      - name: A caller that redirects gets the output and the exit code on its own handles
        shell: pwsh
        run: |
          $piped = & .\qpsync-agent.exe version | Out-String     # the form install-win.ps1 uses
          if ($piped -notmatch 'citest') { throw "piped: got '$piped'" }
          if ($LASTEXITCODE -ne 0) { throw "piped: exit $LASTEXITCODE" }
          .\qpsync-agent.exe version > redirected.txt
          if ((Get-Content redirected.txt -Raw) -notmatch 'citest') { throw "redirected to a file: nothing was written" }
          Set-Content -Path qp.cmd -Value "@echo off`r`n`"%~dp0qpsync-agent.exe`" %*"   # the shim install.go writes
          $shim = cmd /c "qp.cmd version" | Out-String
          if ($shim -notmatch 'citest') { throw "through qp.cmd: got '$shim'" }
          # install-win.ps1 ends with "exit $LASTEXITCODE" after its pipe, so a failed install has to come back
          # non-zero or the member is told it worked. The no-subcommand form exits 2.
          & .\qpsync-agent.exe | Out-Host
          $throughPipe = $LASTEXITCODE
          # and unpiped it does not come back at all, which is why the pipe is there. The sentinel matters: PowerShell
          # leaves $LASTEXITCODE untouched when it does not wait, so without it this reads back the piped 2 above and
          # says the opposite of the truth.
          $global:LASTEXITCODE = 7
          & .\qpsync-agent.exe
          $bare = $LASTEXITCODE
          $global:LASTEXITCODE = 0
          "exit code through a pipe = $throughPipe (want 2), unpiped = $bare (7, the sentinel, means PowerShell never waited for it)"
          if ($throughPipe -ne 2) { throw "a failing exit code did not survive the pipe: got $throughPipe, want 2; install-win.ps1 would report a failed install as a success" }
      - name: Windows accepts the repeating Scheduled Task
        shell: pwsh
        run: go test ./internal/agent -run TestWindowsAcceptsTheRepeatingTask -count=1 -v
      - name: The marker, hidden on Windows, two devices syncing through rclone, and refused folders (docs/adr/0022, 0023)
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "rclone.zip"
          Invoke-WebRequest -Uri https://github.com/rclone/rclone/releases/download/v1.75.1/rclone-v1.75.1-windows-amd64.zip -OutFile $zip
          $sum = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($sum -ne "200eb602c126d82aa38b51e0f6b9ae837473ff99b51278d3f6f837574c494d6e") { throw "rclone zip checksum: $sum" }
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
          $env:QP_RCLONE = (Get-ChildItem -Path $env:RUNNER_TEMP -Recurse -Filter rclone.exe | Select-Object -First 1).FullName
          go test ./internal/agent -run 'TestEnsureMarker|TestEveryDeviceWritesTheSameMarker|TestAMarkerFromTheHubIsHiddenOnWindows|TestARefus|TestTwoDevicesSyncASharedFolderThroughRclone|TestAFailedSync|TestAFolderRefused|TestAFullSync|TestARequestMadeDuringAFullSync|TestStatusGivesARefusedFolder' -count=1 -v
          if ($LASTEXITCODE -ne 0) { throw "marker tests failed" }
