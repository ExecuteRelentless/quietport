name: ci
# Format, vet and test on every push and pull request. The Windows build lives in windows.yml (tags only).
on:
  push:
    branches: ["main"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.27" }
      - name: gofmt
        run: |
          bad=$(gofmt -l cmd internal scripts)
          if [ -n "$bad" ]; then echo "unformatted:"; echo "$bad"; exit 1; fi
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./... -count=1
