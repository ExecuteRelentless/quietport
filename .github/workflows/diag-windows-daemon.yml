name: diag-windows-daemon
# Diagnostic only. For 0.1.22: the background agent must not leave a console window on a member's screen.
# qpsync-agent.exe is a console program and the Scheduled Task the installer registers starts it with an interactive
# token, so Windows opens a black, empty console for it, back at every logon. Closing it kills the agent and the
# task's only trigger is logon, so nothing starts it again: on 2026-09-11 a device sat offline for 10 minutes after
# the window was closed. Two variants, each with its own person, circle and single-use invite:
#   shipped  the published agent, as a CONTROL: its window must be visible, or the check proves nothing
#   fix      this branch's agent: no visible window, and the folder must still sync
# The earlier 0.1.21 seams (fresh, update, stop, reinstall) passed in runs 34656085459, 34656640100 and 34657123245.
# Read the QPC: lines, especially "RESULT".
on:
  push:
    branches: ["diag/windows-daemon"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  agent:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.27" }
      - name: Build the 0.1.22 agent for Windows from this branch
        env: { CGO_ENABLED: "0", GOOS: windows, GOARCH: amd64 }
        run: |
          V=0.1.22
          go build -trimpath -ldflags "-X main.Version=$V -X quietport.app/quietport/internal/agent.Version=$V -X quietport.app/quietport/internal/agent.ReleasePubKey=${{ vars.RELEASE_PUBKEY }}" -o qpsync-agent.exe ./cmd/qpsync-agent
          sha256sum qpsync-agent.exe
      - uses: actions/upload-artifact@v4
        with: { name: agent-0122, path: qpsync-agent.exe }
  windows:
    needs: agent
    strategy:
      fail-fast: false
      matrix:
        include:
          - { variant: shipped, secret: QP_CI_CON_SHIPPED }
          - { variant: fix, secret: QP_CI_CON_FIX }
    name: ${{ matrix.variant }}
    runs-on: windows-11-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: agent-0122, path: C:\Users\Public\qpe2e\agent-0122 }
      - name: Stage the published bundle, this variant's agent and its invite
        shell: pwsh
        env:
          CODE1: ${{ secrets[matrix.secret] }}
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $E = 'C:\Users\Public\qpe2e'
          $V = '${{ matrix.variant }}'
          New-Item -ItemType Directory -Force "$E\bundle", "$E\agent" | Out-Null
          Invoke-WebRequest -Uri https://quietport.app/dl/quietport-windows-amd64.zip -OutFile "$E\bundle.zip"
          Expand-Archive "$E\bundle.zip" -DestinationPath "$E\bundle" -Force
          "QPC: published bundle VERSION $(Get-Content "$E\bundle\VERSION"), variant $V"
          if ($V -eq 'shipped') {
            Copy-Item "$E\bundle\qpsync-agent.exe" "$E\agent\" -Force   # the control: the agent as members have it
          } else {
            Copy-Item "$E\agent-0122\qpsync-agent.exe" "$E\agent\" -Force
          }
          Invoke-WebRequest -Uri "https://quietport.app/j/$env:CODE1/payload" -OutFile "$E\payload1.json"
          Set-Content -Path "$E\code1.txt" -Value $env:CODE1 -NoNewline
          Set-Content -Path "$E\variant.txt" -Value $V -NoNewline
          Set-Content -Path "$E\runid.txt" -Value "${{ github.run_id }}" -NoNewline
          Copy-Item "$env:GITHUB_WORKSPACE\.github\diag\e2e\console.ps1" "$E\console.ps1"
          Set-Content -Path "$E\run.cmd" -Value "@echo off`r`npowershell.exe -NoProfile -ExecutionPolicy Bypass -File `"$E\console.ps1`" > `"$E\out.txt`" 2>&1`r`n"
          icacls $E /grant 'Users:(OI)(CI)M' /T | Out-Null
      - name: Run it as a standard local user (PsExec, real logon)
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $E = 'C:\Users\Public\qpe2e'
          $pw = ConvertTo-SecureString 'Qp-e2e-2026!x' -AsPlainText -Force
          New-LocalUser -Name qpstd -Password $pw -PasswordNeverExpires -AccountNeverExpires | Out-Null
          Add-LocalGroupMember -Group Users -Member qpstd
          Invoke-WebRequest -Uri https://download.sysinternals.com/files/PSTools.zip -OutFile pstools.zip
          Expand-Archive pstools.zip -DestinationPath pstools -Force
          & .\pstools\PsExec64.exe -accepteula -nobanner -u qpstd -p 'Qp-e2e-2026!x' -w $E cmd /c "$E\run.cmd" 2>&1 | Out-String
          "----- out.txt -----"
          Get-Content "$E\out.txt" -ErrorAction SilentlyContinue
