name: windows
# Builds the Windows binaries from source on every tag and, when SignPath is configured, has them signed.
# SignPath Foundation signs open-source projects for free (https://signpath.org/apply). The signing step is skipped
# until the two SIGNPATH_* secrets exist, so the workflow is useful before approval too.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      sign: ${{ steps.cfg.outputs.sign }}
    steps:
      - uses: actions/checkout@v4
      - name: Is SignPath configured?
        id: cfg
        run: echo "sign=${{ secrets.SIGNPATH_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        with: { go-version: "1.27" }
      - name: Versions
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Windows resources (icon, version info, manifest)
        run: |
          go install github.com/tc-hib/go-winres@latest
          for d in cmd/qp-installer cmd/qpsync-agent; do (cd "$d" && go-winres make --arch amd64 --in winres/winres.json); done
      - name: Build agent, qpctl and tailscale for Windows
        env: { CGO_ENABLED: "0", GOOS: windows, GOARCH: amd64 }
        run: |
          V=${{ steps.v.outputs.version }}
          LD="-X main.Version=$V -X quietport.app/quietport/internal/agent.Version=$V -X quietport.app/quietport/internal/agent.ReleasePubKey=${{ vars.RELEASE_PUBKEY }}"
          mkdir -p out/client
          go build -trimpath -ldflags "$LD" -o out/client/qpsync-agent.exe ./cmd/qpsync-agent
          go build -trimpath -ldflags "$LD" -o out/client/qpctl.exe ./cmd/qpctl
          # tailscale is built from its own module (it is not a dependency of this repo)
          mkdir -p /tmp/ts && (cd /tmp/ts && go mod init tsbuild >/dev/null 2>&1; GOFLAGS=-mod=mod go get tailscale.com@v1.102.3 >/dev/null && GOFLAGS=-mod=mod go build -trimpath -ldflags "-s -w" -o "$GITHUB_WORKSPACE/out/client/tailscaled.exe" tailscale.com/cmd/tailscaled && GOFLAGS=-mod=mod go build -trimpath -ldflags "-s -w" -o "$GITHUB_WORKSPACE/out/client/tailscale.exe" tailscale.com/cmd/tailscale)
          curl -fsSL -o rclone.zip https://github.com/rclone/rclone/releases/download/v1.75.1/rclone-v1.75.1-windows-amd64.zip
          unzip -q -j rclone.zip '*/rclone.exe' -d out/client
          echo "$V" > out/client/VERSION
      - name: Installer (client zip embedded)
        env: { CGO_ENABLED: "0", GOOS: windows, GOARCH: amd64 }
        run: |
          V=${{ steps.v.outputs.version }}
          (cd out/client && zip -q -j ../../cmd/qp-installer/bundle.zip ./*)
          LD="-X main.Version=$V -X main.DefaultHost=${{ vars.HUB_HOST }} -X quietport.app/quietport/internal/agent.Version=$V -X quietport.app/quietport/internal/agent.ReleasePubKey=${{ vars.RELEASE_PUBKEY }}"
          go build -trimpath -ldflags "$LD -H windowsgui" -o out/Quietport.exe ./cmd/qp-installer
      - name: Upload unsigned artifacts
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: windows-unsigned
          path: |
            out/Quietport.exe
            out/client/qpsync-agent.exe
            out/client/qpctl.exe
            out/client/tailscaled.exe
            out/client/tailscale.exe
  sign:
    needs: build
    if: needs.build.outputs.sign == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Submit to SignPath
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: quietport
          signing-policy-slug: release-signing
          github-artifact-id: ${{ needs.build.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
      - uses: actions/upload-artifact@v4
        with:
          name: windows-signed
          path: signed
